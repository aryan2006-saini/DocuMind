[project]
name = "documind"
version = "0.1.0"
description = "RAG document assistant: ask questions about your PDFs and get answers with citations"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pypdf>=5.0",
    "fastembed>=0.4",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: needs the Postgres container (docker compose up -d)"]

[tool.ruff]
line-length = 100
